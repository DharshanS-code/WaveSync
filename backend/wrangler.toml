name = "wavesync-signal"
main = "worker.js"
compatibility_date = "2024-09-23"

# Durable Object binding: one instance per room code.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Optional: serve the PWA static assets from the same Worker so the app and
# signaling share an origin. Set the owned WSS endpoint in app Settings.
# Build from the root with `npm run build`; never publish repository source.
# [assets]
# directory = "../dist"
# binding = "ASSETS"
