name = "wavesync-signal"
main = "worker.js"
compatibility_date = "2024-09-23"

# Durable Object binding: one instance per room code.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Optional: serve the PWA static assets from the same Worker so the app and
# signaling share an origin (then the app auto-uses wss://<host>/api/room).
# Uncomment after `npm run build` copies the frontend into ./public, or point
# it at the project root.
# [assets]
# directory = "../"
# binding = "ASSETS"
